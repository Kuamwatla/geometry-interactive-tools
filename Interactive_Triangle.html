    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;style&gt;
  #interactive-triangle { width:100%; color:var(--foreground); font-family:var(--font-sans); }

  #interactive-triangle .side-measure { fill:var(--foreground); font-size:25px; font-weight:500; text-anchor:middle; dominant-baseline:middle; paint-order:stroke; stroke:var(--background); stroke-width:9; stroke-linejoin:round; }
  #interactive-triangle .triangle-classification { fill:var(--foreground); font-size:24px; font-weight:500; }
  #interactive-triangle .vertex-handle { stroke:var(--background); stroke-width:5; cursor:grab; }
  #interactive-triangle .handle-a { fill:var(--viz-series-1); }

&lt;script&gt;
(() =&gt; {
  const root=document.getElementById(&#x27;interactive-triangle&#x27;);
  const svg=root.querySelector(&#x27;#triangleSvg&#x27;);
  const polygon=root.querySelector(&#x27;#triangleShape&#x27;);
  const arcs=root.querySelector(&#x27;#angleArcs&#x27;);
  const sideLabels=root.querySelector(&#x27;#sideLabels&#x27;);
  const labels=root.querySelector(&#x27;#vertexLabels&#x27;);
  const handles=root.querySelector(&#x27;#handles&#x27;);
  const classification=root.querySelector(&#x27;#triangleClassification&#x27;);
  const validation=root.querySelector(&#x27;#validation&#x27;);
  const inputs={A:root.querySelector(&#x27;#angleA&#x27;),B:root.querySelector(&#x27;#angleB&#x27;),C:root.querySelector(&#x27;#angleC&#x27;)};
  const ns=&#x27;http://www.w3.org/2000/svg&#x27;;
  let points={A:{x:170,y:440},B:{x:730,y:440},C:{x:430,y:105}};
  let dragging=null;
  let unitPixels=null;

  const el=(name,attrs,text)=&gt;{const n=document.createElementNS(ns,name);Object.entries(attrs).forEach(([k,v])=&gt;n.setAttribute(k,v));if(text!==undefined)n.textContent=text;return n};

  const distance=(p,q)=&gt;Math.hypot(q.x-p.x,q.y-p.y);
  const angleAt=(v,p,q)=&gt;{
    const a={x:p.x-v.x,y:p.y-v.y},b={x:q.x-v.x,y:q.y-v.y};

  function anglesFromPoints(){return{A:angleAt(points.A,points.B,points.C),B:angleAt(points.B,points.C,points.A),C:angleAt(points.C,points.A,points.B)}}
  const formatLength=value=&gt;{const n=Math.round(value*100)/100;return Number.isInteger(n)?String(n):n.toFixed(2).replace(/0$/,&#x27;&#x27;)};
  function classifyBySides(lengths){
    const values=Object.values(lengths),avg=(values[0]+values[1]+values[2])/3,tolerance=avg*.02;
    if(Math.max(...values)-Math.min(...values)&lt;=tolerance)return&#x27;Equilateral triangle&#x27;;
    if(Math.abs(values[0]-values[1])&lt;=tolerance||Math.abs(values[1]-values[2])&lt;=tolerance||Math.abs(values[2]-values[0])&lt;=tolerance)return&#x27;Isosceles triangle&#x27;;
    return&#x27;Scalene triangle&#x27;;
  }
  function classifyByAngles(values){
    const angles=Object.values(values);
    if(angles.some(v=&gt;Math.abs(v-90)&lt;=1))return&#x27;Right triangle&#x27;;
    if(angles.some(v=&gt;v&gt;90))return&#x27;Obtuse triangle&#x27;;

  function arcData(v,p,q,r){

    while(delta&gt;Math.PI)delta-=2*Math.PI;

  }
  function render(syncInputs=true){
    const values=anglesFromPoints();
    polygon.setAttribute(&#x27;points&#x27;,`${points.A.x},${points.A.y} ${points.B.x},${points.B.y} ${points.C.x},${points.C.y}`);
    arcs.replaceChildren();sideLabels.replaceChildren();labels.replaceChildren();handles.replaceChildren();
    const neighbors={A:[&#x27;B&#x27;,&#x27;C&#x27;],B:[&#x27;C&#x27;,&#x27;A&#x27;],C:[&#x27;A&#x27;,&#x27;B&#x27;]};
    for(const key of [&#x27;A&#x27;,&#x27;B&#x27;,&#x27;C&#x27;]){
      const v=points[key],p=points[neighbors[key][0]],q=points[neighbors[key][1]],smallest=Math.min(distance(v,p),distance(v,q));
      const r=clamp(smallest*.19,38,68),data=arcData(v,p,q,r),measureR=r+35;
      arcs.appendChild(el(&#x27;path&#x27;,{d:data.path,class:`angle-arc arc-${key.toLowerCase()}`}));
      labels.appendChild(el(&#x27;text&#x27;,{x:v.x+measureR*Math.cos(data.mid),y:v.y+measureR*Math.sin(data.mid),class:&#x27;angle-measure&#x27;},`${Math.round(values[key])}°`));
      const centroid={x:(points.A.x+points.B.x+points.C.x)/3,y:(points.A.y+points.B.y+points.C.y)/3};
      const outward=Math.atan2(v.y-centroid.y,v.x-centroid.x);
      labels.appendChild(el(&#x27;text&#x27;,{x:v.x+32*Math.cos(outward),y:v.y+32*Math.sin(outward),class:&#x27;vertex-name&#x27;},key));
      const h=el(&#x27;circle&#x27;,{cx:v.x,cy:v.y,r:17,class:`vertex-handle handle-${key.toLowerCase()}`,role:&#x27;slider&#x27;,&#x27;aria-label&#x27;:`Drag vertex ${key}`,&#x27;data-key&#x27;:key});
      handles.appendChild(h);
      h.addEventListener(&#x27;pointerdown&#x27;,e=&gt;{dragging=key;h.setPointerCapture(e.pointerId)});
    }
    const lengths={AB:distance(points.A,points.B),BC:distance(points.B,points.C),CA:distance(points.C,points.A)};
    if(unitPixels===null)unitPixels=(lengths.AB+lengths.BC+lengths.CA)/3;
    const centroid={x:(points.A.x+points.B.x+points.C.x)/3,y:(points.A.y+points.B.y+points.C.y)/3};
    for(const [name,keys] of Object.entries({AB:[&#x27;A&#x27;,&#x27;B&#x27;],BC:[&#x27;B&#x27;,&#x27;C&#x27;],CA:[&#x27;C&#x27;,&#x27;A&#x27;]})){
      const p=points[keys[0]],q=points[keys[1]],mid={x:(p.x+q.x)/2,y:(p.y+q.y)/2};

      const normal=normals.reduce((best,n)=&gt;{const bx=mid.x+best.x*28,by=mid.y+best.y*28,nx=mid.x+n.x*28,ny=mid.y+n.y*28;return Math.hypot(nx-centroid.x,ny-centroid.y)&gt;Math.hypot(bx-centroid.x,by-centroid.y)?n:best});
      sideLabels.appendChild(el(&#x27;text&#x27;,{x:mid.x+normal.x*29,y:mid.y+normal.y*29,class:&#x27;side-measure&#x27;},formatLength(lengths[name]/unitPixels)));
    }
    classification.textContent=`By sides: ${classifyBySides(lengths)} · By angles: ${classifyByAngles(values)}`;
    if(syncInputs)for(const key of [&#x27;A&#x27;,&#x27;B&#x27;,&#x27;C&#x27;])inputs[key].value=Math.round(values[key]);
    validation.classList.remove(&#x27;error&#x27;);validation.textContent=&#x27;Angle sum: 180°&#x27;;
  }
  function buildFromAngles(A,B,C){
    const r=Math.PI/180,b=Math.sin(B*r)/Math.sin(C*r),raw={A:{x:0,y:0},B:{x:1,y:0},C:{x:b*Math.cos(A*r),y:b*Math.sin(A*r)}};
    const xs=[raw.A.x,raw.B.x,raw.C.x],ys=[raw.A.y,raw.B.y,raw.C.y],minX=Math.min(...xs),maxX=Math.max(...xs),maxY=Math.max(...ys);
    const scale=Math.min(620/(maxX-minX),335/maxY),offsetX=450-(minX+maxX)*scale/2;

    render(false);
  }
  root.querySelector(&#x27;#triangleForm&#x27;).addEventListener(&#x27;submit&#x27;,e=&gt;{
    e.preventDefault();const A=Number(inputs.A.value),B=Number(inputs.B.value),C=Number(inputs.C.value),sum=A+B+C;
    if(![A,B,C].every(v=&gt;Number.isFinite(v)&amp;&amp;v&gt;0&amp;&amp;v&lt;180)||Math.abs(sum-180)&gt;.01){validation.classList.add(&#x27;error&#x27;);validation.textContent=`The three angles must total 180° (current sum: ${sum}°).`;return}
    buildFromAngles(A,B,C);

&lt;script&gt;

  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

    target?.nodeType === Node.ELEMENT_NODE

    target?.nodeType != null &amp;&amp; trigger.contains(target);

    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;

    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };

    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);

      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger

    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil

    openTimeout = window.setTimeout(() =&gt; {
